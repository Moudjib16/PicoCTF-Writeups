name: Writeups

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flag-check:
    name: Check for unredacted flags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/check_flags.py

  update-readme:
    name: Update writeup counts
    needs: flag-check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: update-readme
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/update_readme.py
      - name: Commit if the counts changed
        run: |
          if git diff --quiet README.md; then
            echo "Counts unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "update writeup counts"
          git pull --rebase
          git push
